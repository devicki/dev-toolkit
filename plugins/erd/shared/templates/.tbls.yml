# tbls 설정 (erd 플러그인이 생성): 문서 위치, ERD 형식, 모듈(viewpoint), 품질 검사
name: __PROJECT_NAME__
docPath: docs/schema

er:
  format: mermaid     # GitHub·VS Code·AI가 읽기 좋은 텍스트 형식
  comment: true

# 모듈 단위 문서·ERD. db/modules/*.dbml 과 1:1로 맞춘다.
viewpoints: []
#  - id: user
#    name: 회원 모듈
#    desc: 회원 관련 테이블
#    tables:
#      - users

# 문서 전용 주석·라벨 (ERD_SOURCE=migrations 에서 ADR 참조를 남기는 곳). DB 주석을 대체하니 기존 문구를 살려 쓴다.
# comments:
#   - table: users
#     tableComment: "회원. ADR-003: 소프트 삭제"
#     columnComments:
#       deleted_at: "삭제 시각, NULL=활성 (ADR-003)"
#     labels: [ADR-003]

lint:
  requireTableComment:
    enabled: true
  requireColumnComment:
    enabled: true
  requireForeignKeyIndex:
    enabled: true
  unrelatedTable:
    enabled: true
  requireViewpoints:
    enabled: true
