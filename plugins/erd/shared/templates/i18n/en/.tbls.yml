# tbls settings (generated by the erd plugin): doc location, ERD format, modules (viewpoints), quality checks
name: __PROJECT_NAME__
docPath: docs/schema

er:
  format: mermaid     # text format that GitHub, VS Code and AI agents read well
  comment: true

# Per-module docs and ERDs. Keep 1:1 with db/modules/*.dbml.
viewpoints: []
#  - id: user
#    name: User module
#    desc: User-related tables
#    tables:
#      - users

# Doc-only comments and labels (where ERD_SOURCE=migrations units link ADRs). They REPLACE DB comments, so keep the existing text.
# comments:
#   - table: users
#     tableComment: "Users. ADR-003: soft delete"
#     columnComments:
#       deleted_at: "Deleted at, NULL = active (ADR-003)"
#     labels: [ADR-003]

lint:
  requireTableComment:
    enabled: true
  requireColumnComment:
    enabled: true
  requireForeignKeyIndex:
    enabled: true
  unrelatedTable:
    enabled: true
  requireViewpoints:
    enabled: true
